name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    # macos-26 ships Xcode 26.x by default; the code uses macOS 26 SDK APIs
    # (NSGlassEffectView, ControlSize.extraLarge) that older images can't compile.
    runs-on: macos-26
    permissions:
      contents: write
    outputs:
      ed_signature: ${{ steps.sparkle_sign.outputs.ed_signature }}
    steps:
      - uses: actions/checkout@v5

      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > /tmp/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import /tmp/certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm /tmp/certificate.p12

      - name: Install CocoaPods
        run: gem install cocoapods

      - name: Install Pods
        run: pod install

      - name: Stamp version into Info.plist
        run: |
          sed -i '' "s/#VERSION#/${{ env.VERSION }}/g" Info.plist

      - name: Build release app
        run: |
          xcodebuild -workspace ztabby.xcworkspace \
            -scheme Release \
            -configuration Release \
            -derivedDataPath DerivedData \
            build

      - name: Verify code signature
        run: |
          APP_PATH="DerivedData/Build/Products/Release/Ztabby.app"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign --display --verbose=2 "$APP_PATH" 2>&1 | grep -E "Authority|TeamIdentifier|flags"

      - name: Create DMG
        run: |
          APP_PATH="DerivedData/Build/Products/Release/Ztabby.app"
          DMG_NAME="Ztabby_${{ env.VERSION }}_aarch64.dmg"
          mkdir -p /tmp/dmg-contents
          cp -R "$APP_PATH" /tmp/dmg-contents/
          ln -s /Applications /tmp/dmg-contents/Applications
          hdiutil create -volname "Ztabby" \
            -srcfolder /tmp/dmg-contents \
            -ov -format UDZO \
            "DerivedData/Build/Products/Release/$DMG_NAME"

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG_PATH="DerivedData/Build/Products/Release/Ztabby_${{ env.VERSION }}_aarch64.dmg"
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 15m
          xcrun stapler staple "$DMG_PATH"

      # Sign AFTER stapling — stapling modifies the DMG, which would invalidate
      # a signature computed earlier.
      - name: Sign DMG for Sparkle
        id: sparkle_sign
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          DMG_PATH="DerivedData/Build/Products/Release/Ztabby_${{ env.VERSION }}_aarch64.dmg"
          SIGNATURE=$(Pods/Sparkle/bin/sign_update -s "$SPARKLE_ED_PRIVATE_KEY" "$DMG_PATH")
          echo "ed_signature=$SIGNATURE" >> "$GITHUB_OUTPUT"

      # The release skill creates a draft release with hand-written notes before
      # pushing the tag. Upload the DMG to that draft and publish it. If no draft
      # exists (e.g. tag pushed manually), create one with auto-generated notes.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DMG_PATH="DerivedData/Build/Products/Release/Ztabby_${{ env.VERSION }}_aarch64.dmg"
          if ! gh release view "v${{ env.VERSION }}" > /dev/null 2>&1; then
            gh release create "v${{ env.VERSION }}" --draft --title "Ztabby v${{ env.VERSION }}" --generate-notes
          fi
          gh release upload "v${{ env.VERSION }}" "$DMG_PATH" --clobber
          gh release edit "v${{ env.VERSION }}" --draft=false --latest

  update-website:
    needs: build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
      - name: Update homepage download link and version
        run: |
          sed -i 's|releases/download/v[0-9.]*/Ztabby[_-][0-9.]*[^"]*|releases/download/v${{ env.VERSION }}/Ztabby_${{ env.VERSION }}_aarch64.dmg|' docs/index.html
          sed -i 's|v[0-9.]*[0-9] \&middot; macOS|v${{ env.VERSION }} \&middot; macOS|' docs/index.html
      - name: Add release to Sparkle appcast
        env:
          ED_SIGNATURE_AND_LENGTH: ${{ needs.build-macos.outputs.ed_signature }}
        run: scripts/update_appcast.sh
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/appcast.xml
          git diff --cached --quiet || git commit -m "Update website to v${{ env.VERSION }}"
          git push
